services:
  backend:
    image: crpi-hitbvew6o79ovt1g.cn-shanghai.personal.cr.aliyuncs.com/avajia_ns/kefu_report_backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - reports_data:/app/reports
      - analyze_summary_data:/app/analyze_summary
      - knowledge_data:/app/knowledge
      - logs_data:/app/logs
    restart: unless-stopped

  web:
    image: crpi-hitbvew6o79ovt1g.cn-shanghai.personal.cr.aliyuncs.com/avajia_ns/kefu_report_web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: unless-stopped

  cron:
    image: crpi-hitbvew6o79ovt1g.cn-shanghai.personal.cr.aliyuncs.com/avajia_ns/kefu_report_backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - reports_data:/app/reports
      - analyze_summary_data:/app/analyze_summary
      - knowledge_data:/app/knowledge
      - logs_data:/app/logs
    depends_on:
      - backend
    restart: unless-stopped
    command: ["/usr/local/bin/supercronic", "-passthrough-logs", "/etc/crontab"]

volumes:
  reports_data:
  analyze_summary_data:
  knowledge_data:
  logs_data:
